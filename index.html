<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silver</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #0f0f1a,
                #24113d,
                #071a1f
            );
        }

        h1 {
            align-items: center;
            font-size: 900%;
            color: silver;
            text-align: center;
            background-color: black;
            padding: 0px;
            border-radius: 10px;

            position: relative;
            top: -95px;
        }

        .buttons-container {
            position: relative;
            top: -95px;

            background-color: purple;
            padding: 20px;
            border-radius: 20px;

            display: flex;
            justify-content: center;
            gap: 50px;

            width: 100%;
            box-sizing: border-box;
        }

        .buttons-container button {
            background: black;
            color: white;

            border: 2px solid cyan;
            padding: 15px 30px;

            border-radius: 5px;

            font-size: 70px;

            cursor: pointer;
            transition: 0.3s;

            flex-shrink: 0;
        }

        .buttons-container button:hover {
            background-color: cyan;
            color: black;
        }


        /* ========================= */
        /*        MOBILE              */
        /* ========================= */

        @media (max-width: 768px) {

            h1 {
                font-size: 25vw;
                top: -30px;
            }

            .buttons-container {
                top: -30px;

                width: 90%;
                margin: auto;

                flex-direction: column;
                align-items: center;

                gap: 20px;
            }

            .buttons-container button {
                width: 90%;

                font-size: 35px;

                padding: 15px 10px;
            }
        }

    </style>
</head>

<body>

    <h1>Silver</h1>

    <div class="buttons-container">

        <button onclick="window.open('https://www.facebook.com/profile.php?id=100095194721243', '_blank')">
            FaceBook
        </button>

        <button onclick="window.open('https://www.youtube.com/@M-Silver0823', '_blank')">
            YouTube
        </button>

        <button onclick="window.open('https://discord.gg/kj6hGfaFmH', '_blank')">
            Discord
        </button>

        <button onclick="window.open('https://discord.gg/kj6hGfaFmH', '_blank')">
            Discord
        </button>

    </div>

</body>

</html>

</html>
